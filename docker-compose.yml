version: "3.9"

services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: owl24-backend
    env_file:
      - apps/backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./apps/backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: owl24-postgres
    environment:
      POSTGRES_DB: owl24
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d owl24"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: owl24-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

    worker:
    build:
      context: ./apps/backend
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    env_file:
      - ./apps/backend/.env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./apps/backend:/app

  beat:
    build:
      context: ./apps/backend
    command: celery -A app.core.celery_app.celery_app beat --loglevel=info
    env_file:
      - ./apps/backend/.env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./apps/backend:/app

volumes:
  postgres_data:
